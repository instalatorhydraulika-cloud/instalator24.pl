name: Publikacja podglądu (GitHub Pages)

# Publikuje statyczny podgląd strony głównej FlowInstal (folder /site)
# na GitHub Pages — do obejrzenia na telefonie/komputerze.

on:
  push:
    branches:
      - claude/wordpress-brzeziny-site-egws1w
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj i włącz GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Spakuj stronę (katalog główny)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
