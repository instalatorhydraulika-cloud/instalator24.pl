name: Publikacja aplikacji Taktyka Orlik (GitHub Pages)

# Buduje aplikację React (taktyka-orlik) i publikuje ją na GitHub Pages,
# aby kapitan mógł otworzyć narzędzie przez link na telefonie.

on:
  push:
    branches:
      - claude/football-tactics-app-dhjged
    paths:
      - 'taktyka-orlik/**'
      - '.github/workflows/deploy-taktyka.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: taktyka-orlik/package-lock.json

      - name: Zainstaluj zależności
        working-directory: taktyka-orlik
        run: npm ci

      - name: Zbuduj aplikację
        working-directory: taktyka-orlik
        run: npm run build

      - name: Skonfiguruj i włącz GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Spakuj artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: taktyka-orlik/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wdróż na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
